<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Words Match-3 Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 15px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Dashboards */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f1f2f6;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 20px;
            color: #2980b9;
        }

        /* Grid Setup */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        /* Flip Card Effect */
        .card {
            aspect-ratio: 1;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        /* ด้านหลังการ์ด (ซ่อนคำศัพท์) */
        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            color: #fff;
            font-size: 24px;
            border: 2px solid #fff;
        }

        /* ด้านหน้าการ์ด (เปิดเห็นคำศัพท์) */
        .card-back {
            background: #3498db;
            color: white;
            transform: rotateY(180deg);
            word-break: break-word;
            padding: 5px;
        }

        .card.selected .card-back {
            background: #e67e22;
        }

        .card.matched {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
            pointer-events: none;
        }

        /* Controls */
        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s;
        }

        .btn:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🎮 Match-3 Word Game</h1>
        <p class="subtitle">จับคู่คำศัพท์ภาษาอังกฤษที่เหมือนกัน 3 ใบ!</p>

        <div class="stats-bar">
            <div class="stat-item">
                <span>ด่าน (Level)</span>
                <span id="level" class="stat-value">1</span>
            </div>
            <div class="stat-item">
                <span>คะแนน (Score)</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span>เวลา (Time)</span>
                <span id="timer" class="stat-value">45s</span>
            </div>
        </div>

        <div class="grid" id="gameGrid"></div>

        <button class="btn" onclick="restartGame()">เริ่มเกมใหม่</button>
    </div>

    <script>
        // คลังคำศัพท์แบ่งตามระดับ
        const wordPool = [
            ['Cat', 'Dog', 'Sun', 'Boy'],               // Level 1 (4 คำ = 12 ใบ)
            ['Apple', 'Book', 'Fish', 'Tree'],          // Level 2
            ['Duck', 'Milk', 'Bird', 'Star'],           // Level 3
            ['Happy', 'Smile', 'Water', 'House']        // Level 4
        ];

        let currentLevel = 0;
        let score = 0;
        let timeLeft = 45;
        let timerInterval = null;
        let selectedCards = [];
        let isProcessing = false;

        // ระบบเสียง (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(150, 'sawtooth', 0.5);
                    alert('⏰ หมดเวลาแล้ว! คะแนนของคุณคือ: ' + score);
                    restartGame();
                }
            }, 1000);
        }

        function initLevel() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            selectedCards = [];
            isProcessing = false;

            document.getElementById('level').innerText = currentLevel + 1;
            
            // เลือกคำศัพท์ประจำด่าน
            const currentWords = wordPool[currentLevel % wordPool.length];
            
            // สร้างการ์ด 3 ใบต่อ 1 คำศัพท์
            let boardWords = [...currentWords, ...currentWords, ...currentWords];

            // สลับการ์ด (Shuffle)
            boardWords.sort(() => Math.random() - 0.5);

            // สร้างการ์ดบน Element
            boardWords.forEach((word) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.word = word;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">❓</div>
                        <div class="card-back">${word}</div>
                    </div>
                `;

                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isProcessing || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound(400, 'sine', 0.05); // เสียงกดเปิดการ์ด
            card.classList.add('flipped', 'selected');
            selectedCards.push(card);

            // เมื่อเปิดครบ 3 ใบ
            if (selectedCards.length === 3) {
                isProcessing = true;
                const [c1, c2, c3] = selectedCards;

                // ตรวจสอบว่าคำศัพท์ตรงกันทั้ง 3 ใบหรือไม่
                if (c1.dataset.word === c2.dataset.word && c2.dataset.word === c3.dataset.word) {
                    setTimeout(() => {
                        playSound(600, 'triangle', 0.2); // เสียงจับคู่ถูก
                        selectedCards.forEach(c => c.classList.add('matched'));
                        score += 30;
                        document.getElementById('score').innerText = score;
                        selectedCards = [];
                        isProcessing = false;
                        checkWin();
                    }, 400);
                } else {
                    setTimeout(() => {
                        playSound(200, 'square', 0.2); // เสียงเลือกผิด
                        selectedCards.forEach(c => c.classList.remove('flipped', 'selected'));
                        selectedCards = [];
                        isProcessing = false;
                    }, 800);
                }
            }
        }

        function checkWin() {
            const remainingCards = document.querySelectorAll('.card:not(.matched)');
            if (remainingCards.length === 0) {
                setTimeout(() => {
                    playSound(800, 'sine', 0.4);
                    alert(`🎉 ผ่านด่านที่ ${currentLevel + 1} แล้ว!`);
                    currentLevel++;
                    timeLeft += 20; // เพิ่มเวลาให้เมื่อผ่านด่าน
                    initLevel();
                }, 300);
            }
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            timeLeft = 45;
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft + 's';
            initLevel();
            startTimer();
        }

        // เริ่มเกมทันทีเมื่อเข้าหน้าเว็บ
        window.onload = () => {
            restartGame();
        };
    </script>
</body>
</html>
